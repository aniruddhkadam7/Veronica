[package]
name = "desktop"
version = "0.1.0"
description = "Smallbird Local — personal desktop build with your own AI API key"
authors = ["you"]
edition = "2021"
default-run = "desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.24.0"
crossbeam-channel = "0.5.16"
log = "0.4.33"
env_logger = "0.11.11"
rubato = "0.15"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "blocking", "multipart", "stream", "rustls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Security",
    # Fast-router native actions added for the low-latency re-architecture
    # (src/actions/native.rs): window enumeration/focus/minimize/maximize
    # for WindowOp, Core Audio for VolumeOp, clipboard for ClipboardOp, and
    # GDI for the CaptureScreen agent-loop tool.
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    # System Agent extension (src/actions/storage.rs, processes.rs,
    # network.rs): recycle-bin-safe delete via the Shell, and process/network
    # queries.
    "Win32_UI_Shell_Common",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sysinfo = "0.32"
tauri-plugin-global-shortcut = "2.3.2"
keyring = { version = "3", features = ["windows-native"] }
# App Paths / Start Menu shortcut lookup for Veronica's action system (see
# src/actions/native.rs) — already resolved transitively (e.g. via keyring),
# declared directly here since we call it ourselves rather than relying on
# an internal dependency's copy.
winreg = "0.55"
# Declared directly (not just relied on transitively) so
# `rustls::crypto::ring::default_provider().install_default()` can be called
# explicitly at process start — see src/tls_init.rs for why this is needed
# by every HTTPS reqwest::Client in this crate, including the direct AI
# provider calls in src/personal/providers/.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }
# Already pulled in transitively by rustls's "ring" feature above — declared
# directly only so its CSPRNG (SystemRandom) can be used to generate the RAG
# service's per-launch internal auth token (see src/rag/process.rs). Adds no
# new crate to the dependency tree.
ring = "0.17"
# Deepgram Flux TTS playback (src/tts/player.rs) — plays raw linear16 PCM
# chunks on the default output device as they stream in over the Flux
# WebSocket, so speech starts on the first chunk instead of waiting for the
# whole utterance to synthesize. Pulls in `cpal` transitively for the actual
# device I/O, mirroring how `wasapi` already handles capture-side device I/O
# in src/audio/.
rodio = { version = "0.20", default-features = false }
# Named directly (not only pulled in transitively via rodio) so tts::player
# can enumerate/select a specific output device by name via HostTrait —
# rodio re-exports the Device/DeviceTrait bits but not HostTrait. Left
# unpinned to whatever rodio 0.20 already resolves so cargo doesn't end up
# with two cpal versions in the dependency tree.
cpal = "0.15"
# Deepgram Flux TTS (src/tts/deepgram_flux.rs) talks a persistent
# `wss://` WebSocket session, not plain HTTP — `tungstenite`'s blocking
# client (not `tokio-tungstenite`) matches every other network call in this
# crate (reqwest::blocking, Groq STT) which all run on a dedicated
# std::thread rather than through the async runtime, so a sync client avoids
# threading a tokio reactor through code that's synchronous everywhere else.
# `rustls-tls-webpki-roots` reuses the same rustls stack already installed
# process-wide (see src/tls_init.rs) instead of pulling in native-tls/OpenSSL.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
http = "1.5.0"
# System Agent extension (src/actions/watchers.rs): filesystem watching for
# Capability::WatcherOp — a native OS filesystem-notification API
# (ReadDirectoryChangesW on Windows), not a polling loop.
notify = "6"

[dev-dependencies]
# Enables `tauri::test::mock_app()` — used by execute_tool's own tests
# (src/actions/mod.rs) to exercise the real dispatch path end-to-end
# (including SchedulerOp/WatcherOp, which need a real AppHandle) without a
# full running app.
tauri = { version = "2", features = ["test"] }

